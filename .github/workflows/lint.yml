# Vault lint on every push to main (#28). The same checks as the pre-commit
# hook in .githooks/: the lint's tests, the acceptance script's tests, then the
# vault lint itself. A violation fails the push check.
name: vault lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint tests
        run: python3 -m unittest discover lint -q
      - name: Acceptance script tests
        run: |
          git config user.email "ci@example.invalid"
          git config user.name "vault lint"
          python3 -m unittest discover acceptance -q
      - name: Vault lint
        run: python3 lint/vault_lint.py
